<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgroReady — ExportBot + CarbonBot</title>
    <meta
      name="description"
      content="AgroReady: leitura de laudos fitossanitários com PLN, prontidão para exportação (ExportBot) e elegibilidade a créditos de carbono (CarbonBot)."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231f5c3f'/%3E%3Cpath d='M9 23c0-8 5-13 14-14-1 9-6 14-14 14zm0 0 7-7' fill='none' stroke='%23f3c98b' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // aplica o tema antes de pintar a página (evita piscar claro → escuro)
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('agroready-tema') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
