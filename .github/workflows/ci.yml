name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build, testes, NER, banco)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agroready
          POSTGRES_PASSWORD: agroready
          POSTGRES_DB: agroready
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agroready"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # só para o CI: banco descartável e segredos de mentira
      DATABASE_URL: postgresql://agroready:agroready@localhost:5432/agroready
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Testes unitários
        run: npm test
      - name: Avaliação do NER (precisão, revocação, F1)
        run: npm run avaliar:ner
      - name: Migrações e seed em um Postgres limpo
        run: npx prisma migrate deploy && npm run db:seed
      - name: Seed de novo (precisa ser idempotente)
        run: npm run db:seed

  frontend:
    name: Frontend (tipos e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tipos e build
        run: npm run build
